<style>
/* Layout: 頂部分頁；左欄題目清單、右欄一次只練一題（手機時上下堆疊） */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --fg:#26292b; --muted:#6c7172; --line:#dfe1dd;
  --accent:#5f7a72; --accent-soft:#e3ebe7; --hard:#b0756b; --hard-soft:#f3e4e0; --done:#6f8f6a;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1d1e; --surface:#232627; --fg:#e7e8e5; --muted:#9ba09e; --line:#363a3a;
  --accent:#8fb0a6; --accent-soft:#2c3936; --hard:#d39a8f; --hard-soft:#3d2c29; --done:#9bbd94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1d1e; --surface:#232627; --fg:#e7e8e5; --muted:#9ba09e; --line:#363a3a;
  --accent:#8fb0a6; --accent-soft:#2c3936; --hard:#d39a8f; --hard-soft:#3d2c29; --done:#9bbd94; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.countdown{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}
.countdown b{color:var(--accent);font-size:20px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:78vh;min-width:0}
@media (max-width:820px){aside{max-height:300px}}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.list{overflow-y:auto;padding:6px}
.group-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);font-weight:500}
.item .t{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--line)}
.dot.done{background:var(--done);border-color:var(--done)} .dot.hard{background:var(--hard);border-color:var(--hard)}
.tag{font-size:11px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;flex:none}
main.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.crumb{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
.cue{border-left:3px solid var(--accent);padding:4px 0 4px 16px}
.cue p{margin:0 0 4px;color:var(--muted)} .cue ul{margin:0;padding-left:20px}
.timer-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.clock{font-family:var(--f-mono);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:var(--hard)}
.phase{font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{font:inherit;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
button.b.hardbtn[aria-pressed="true"]{background:var(--hard-soft);border-color:var(--hard);color:var(--hard)}
button.b.donebtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--done);color:var(--done)}
button.b:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f span.hint{font-size:12px;opacity:.85}
textarea,input[type=text],select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.55}
.feedback{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;white-space:pre-wrap;font-size:14px;line-height:1.7}
.note{font-size:12.5px;color:var(--muted);margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:none;font-family:inherit;cursor:pointer}
.step[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:500}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:700;font-size:14px;padding:0 6px}
.prompt-box{font-size:16.5px;line-height:1.65;background:var(--bg);border-radius:8px;padding:14px 16px;border:1px solid var(--line)}
.outline{display:flex;flex-direction:column;gap:12px;font-size:15px}
.outline h4{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.outline p{margin:0}
.rec{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.rec .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.rec details summary{cursor:pointer;font-weight:500}
.status{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

/* ---------- 共用：計時器 ---------- */
let tick = null;
function stopTimer() { clearInterval(tick); tick = null; }
function runTimer({ seconds, countUp = false, target = 0, onEnd, render }) {
  stopTimer();
  let t = 0;
  render(countUp ? 0 : seconds, 0);
  tick = setInterval(() => {
    t++;
    if (countUp) { render(t, target ? Math.min(t / target, 1) : 0); }
    else {
      const left = seconds - t;
      render(Math.max(left, 0), t / seconds);
      if (left <= 0) { stopTimer(); onEnd && onEnd(); }
    }
  }, 1000);
}
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

/* ---------- 錄音轉文字（Whisper，在 Cloudflare 上跑） ---------- */
const TRANSCRIBE_URL = "https://ielts-review.cy9202.workers.dev/transcribe";

// 不管瀏覽器錄成 webm 還是 mp4，都先轉成 16kHz 單聲道 WAV 再送出
async function toWav16k(blob) {
  const raw = await blob.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  const decoded = await ctx.decodeAudioData(raw);
  ctx.close();
  const rate = 16000, len = Math.ceil(decoded.duration * rate);
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: "audio/wav" });
}

function recorder(ta, onText) {
  if (!canRecord) return el("span", { class: "status" }, "這個瀏覽器不能錄音，請用 Chrome、Edge 或 Safari。");
  const status = el("span", { class: "status" });
  const player = el("audio", { controls: true, hidden: true, style: "width:100%;max-width:420px;height:36px" });
  const btn = el("button", { class: "b primary" }, "● 錄音");
  let rec = null, chunks = [], t0 = 0, iv = null, stream = null;
  const stop = () => { if (rec && rec.state === "recording") rec.stop(); };
  btn.addEventListener("click", async () => {
    if (rec && rec.state === "recording") { stop(); return; }
    if (activeRec && activeRec !== stop) activeRec();
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { status.textContent = "沒有拿到麥克風權限。請在網址列左邊的鎖頭圖示允許麥克風。"; return; }
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      clearInterval(iv); activeRec = null;
      stream.getTracks().forEach(t => t.stop());
      btn.textContent = "● 重錄"; btn.disabled = true;
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      player.src = URL.createObjectURL(blob); player.hidden = false;
      status.textContent = "轉文字中…";
      try {
        const wav = await toWav16k(blob);
        const r = await fetch(TRANSCRIBE_URL, { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) status.textContent = j.message || "轉文字失敗，請再錄一次。";

      } catch { status.textContent = "轉文字失敗，請檢查網路後再錄一次。"; }
      btn.disabled = false;
    };
    rec.start(); t0 = Date.now(); activeRec = stop;
    btn.textContent = "■ 停止 0:00"; status.textContent = "錄音中，說完按停止。";
    iv = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); btn.textContent = `■ 停止 ${mmss(s)}`; if (s >= 300) stop(); }, 500);
  });

    el("div", { class: "btns", style: "align-items:center" }, btn, status), player);
}

    const q = it.qs[SP.step]; const qid = `${it.id}:${SP.step}`;
    p.append(
      el("div", { class: "crumb" }, el("span", {}, "Part 1"), el("span", {}, "·"), el("span", {}, it.title), el("span", { class: "tag" }, LABEL[it.kind]), el("span", {}, `第 ${SP.step + 1} / ${it.qs.length} 題`)),
      qBlock([el("h2", { class: "q" }, q)], SP.step === 0 ? `Now, let's talk about ${it.title.toLowerCase()}. ${q}` : q, 1),
      el("p", { class: "note" }, "每題講 2–3 句，約 20–30 秒：直接回答 → 原因 → 小例子。"),
      el("div", { class: "timer-row" }, clock, phase), bar,
      el("div", { class: "btns" },
        el("button", { class: "b primary", onclick: () => { phase.textContent = "目標 20–30 秒"; runTimer({ seconds: 0, countUp: true, target: 30, render: (s, f) => { paint(s, f); clock.classList.toggle("warn", s > 40); } }); } }, "開始作答"),
        el("button", { class: "b", disabled: SP.step === 0, onclick: () => { SP.step--; stopTimer(); renderSpPanel(); } }, "上一題"),
        el("button", { class: "b", onclick: () => { stopTimer(); if (SP.step < it.qs.length - 1) { SP.step++; renderSpPanel(); } else { marks[it.id] = marks[it.id] || "done"; store.set("marks", marks); nextTopic(); } } }, SP.step < it.qs.length - 1 ? "下一題" : "下一個主題"),
        ...markButtons(qid)),
      answerArea(qid, q, 1));
    return;
  }

  // Part 2 → Part 3
  if (SP.step === 0) {
    const qid = it.id;
    const notes = el("textarea", { id: "notes-" + qid, rows: "3", placeholder: "準備時間寫關鍵字（考場會給紙筆）" });
    notes.value = store.get("notes:" + qid, "");
    notes.addEventListener("input", () => store.set("notes:" + qid, notes.value));
    const startPrep = () => { phase.textContent = "準備 1 分鐘"; runTimer({ seconds: 60, render: (s, f) => { paint(s, f); clock.classList.toggle("warn", s <= 10); }, onEnd: startTalk }); };
    const startTalk = () => { phase.textContent = "開始說，講滿 2 分鐘"; runTimer({ seconds: 120, render: (s, f) => { paint(s, f); clock.classList.toggle("warn", s <= 15); }, onEnd: () => { phase.textContent = "時間到。考官會在這裡打斷你。"; } }); };
    p.append(
      el("div", { class: "crumb" }, el("span", {}, "Part 2"), el("span", {}, "·"), el("span", {}, it.cat), el("span", { class: "tag" }, LABEL[it.kind])),
      qBlock([el("h2", { class: "q" }, it.full),
        el("div", { class: "cue" }, el("p", {}, "You should say:"), el("ul", {}, it.bullets.map(b => el("li", {}, b))))],
        `Now, I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say. You can make some notes if you wish. Here is your topic. ${it.full}. You should say: ${it.bullets.join(". ")}.`, 2),
      el("div", { class: "timer-row" }, clock, phase), bar,
      el("div", { class: "btns" },
        el("button", { class: "b primary", onclick: startPrep }, "準備 1 分鐘 → 說 2 分鐘"),
        el("button", { class: "b", onclick: startTalk }, "跳過準備，直接說"),
        el("button", { class: "b", onclick: () => { stopTimer(); SP.step = 1; renderSpPanel(); } }, "進入 Part 3 →"),
        ...markButtons(qid)),
      el("label", { class: "f", for: "notes-" + qid }, "準備筆記"), notes,
      answerArea(qid, it.full, 2));
    clock.textContent = "1:00";
    return;
  }
  const k = SP.step - 1, q = it.p3[k], qid = `${it.id}:p3-${k}`;
  p.append(
    el("div", { class: "crumb" }, el("span", {}, "Part 3"), el("span", {}, "·"), el("span", {}, it.title), el("span", {}, `第 ${k + 1} / ${it.p3.length} 題`)),
    qBlock([el("h2", { class: "q" }, q)], k === 0 ? `We've been talking about ${it.title}, and I'd like to discuss with you one or two more general questions related to this. ${q}` : q, 3),
    el("p", { class: "note" }, "講 40–60 秒：觀點 → 原因 → 例子 → 讓步或對比（However, …）→ 回到觀點。"),
    el("div", { class: "timer-row" }, clock, phase), bar,
    el("div", { class: "btns" },
      el("button", { class: "b primary", onclick: () => { phase.textContent = "目標 40–60 秒"; runTimer({ seconds: 0, countUp: true, target: 60, render: (s, f) => { paint(s, f); clock.classList.toggle("warn", s > 75); } }); } }, "開始作答"),
      el("button", { class: "b", onclick: () => { stopTimer(); SP.step--; renderSpPanel(); } }, k === 0 ? "← 回 Part 2" : "上一題"),
      el("button", { class: "b", onclick: () => { stopTimer(); if (k < it.p3.length - 1) { SP.step++; renderSpPanel(); } else nextTopic(); } }, k < it.p3.length - 1 ? "下一題" : "下一張題卡"),
      ...markButtons(qid)),
    answerArea(qid, q, 3));
}
function renderSpeak() { renderSpFilters(); renderSpList(); renderSpPanel(); }

/* ---------- 寫作 ---------- */
const WR = { type: store.get("wrType", "all"), sel: store.get("wrSel", 0), step: 0 };
const FIELDS = [
  ["型別與立場", [
    ["kind", "這題是什麼題型？", "select"],
    ["stance", "我的立場（一句英文）", "例：I largely agree, because … but …"],
  ]],
  ["引言", [
    ["intro1", "改寫題目（paraphrase）", "用同義詞改寫題目，不要照抄"],
    ["intro2", "立場句（thesis）", "清楚說出你的立場，並預告兩個理由"],
  ]],
  ["主體段 1", [
    ["b1t", "主題句", "這段只講一個論點"],
    ["b1e", "解釋句", "為什麼這個論點成立"],
    ["b1x", "具體例子", "一個具體情境，不要寫「研究顯示」"],
    ["b1l", "回扣句", "把例子連回你的立場"],
  ]],
  ["主體段 2", [
    ["b2t", "主題句", "第二個論點（或讓步：Admittedly, …）"],
    ["b2e", "解釋句", ""],
    ["b2x", "具體例子", ""],
    ["b2l", "回扣句", ""],
  ]],
  ["結論", [
    ["c1", "重述立場", "換句話說，不加新觀點"],
    ["c2", "收尾句", "建議或展望，一句就好"],
  ]],
];
function wrPrompt() { return WR.sel === -1 ? store.get("customPrompt", "") : W2[WR.sel][1]; }
function wrKey() { return "essay:" + (WR.sel === -1 ? "custom" : WR.sel); }
function renderWrFilters() {
  const f = $("#wr-filters"); f.replaceChildren();
  const chip = (k, l) => el("button", { class: "chip", "aria-pressed": String(WR.type === k), onclick: () => { WR.type = k; store.set("wrType", k); renderWrite(); } }, l);
  f.append(chip("all", "全部"), ...Object.entries(TYPES).map(([k, l]) => chip(k, l)));
}
function renderWrList() {
  const list = $("#wr-list"); list.replaceChildren();
  W2.forEach(([k, txt], i) => {
    if (WR.type !== "all" && WR.type !== k) return;
    const saved = store.get("essay:" + i, null);
    list.append(el("button", { class: "item", "aria-current": String(WR.sel === i), onclick: () => { WR.sel = i; WR.step = 0; store.set("wrSel", i); renderWrite(); } },
      el("span", { class: "dot " + (saved && saved.done ? "done" : "") }),
      el("span", { class: "t" }, txt.length > 70 ? txt.slice(0, 70) + "…" : txt)));
  });
  list.append(el("div", { class: "group-h" }, "自己的題目"),
    el("button", { class: "item", "aria-current": String(WR.sel === -1), onclick: () => { WR.sel = -1; WR.step = 0; store.set("wrSel", -1); renderWrite(); } },
      el("span", { class: "dot" }), el("span", { class: "t" }, "貼上一題自己找的題目")));
}
function renderWrPanel() {
  const p = $("#wr-panel"); p.replaceChildren();
  const data = store.get(wrKey(), {});
  const save = () => store.set(wrKey(), data);
  const steps = el("div", { class: "steps" });
  const names = [...FIELDS.map(f => f[0]), "整理檢查"];
  names.forEach((n, i) => steps.append(el("button", { class: "step", "aria-current": String(WR.step === i), onclick: () => { WR.step = i; renderWrPanel(); } }, `${i + 1} ${n}`)));

  const head = [];
  if (WR.sel === -1) {
    const cp = el("textarea", { id: "custom-prompt", rows: "3", placeholder: "把題目貼在這裡" });
    cp.value = store.get("customPrompt", "");
    cp.addEventListener("input", () => store.set("customPrompt", cp.value));
    head.push(el("label", { class: "f", for: "custom-prompt" }, "題目"), cp);
  } else {
    head.push(el("div", { class: "crumb" }, el("span", {}, "Task 2"), el("span", {}, "·"), el("span", {}, TYPES[W2[WR.sel][0]])),
      el("div", { class: "prompt-box" }, wrPrompt()));
  }
  const clock = el("div", { class: "clock", style: "font-size:28px" }, "10:00");
  const timerRow = el("div", { class: "timer-row" }, clock,
    el("button", { class: "b", onclick: () => runTimer({ seconds: 600, render: s => { clock.textContent = mmss(s); clock.classList.toggle("warn", s <= 60); } }) }, "大綱計時 10 分鐘"),
    el("span", { class: "phase" }, "考場上大綱 5 分鐘、寫作 35 分鐘；練習時大綱可以慢一點。"));
  p.append(...head, timerRow, steps);

  if (WR.step < FIELDS.length) {
    const [title, fields] = FIELDS[WR.step];
    const fs = el("fieldset", {}, el("legend", {}, title));
    for (const [key, label, hint] of fields) {
      const id = "w-" + key;
      let input;
      if (hint === "select") {
        input = el("select", { id }, el("option", { value: "" }, "選一個"), ...Object.entries(TYPES).map(([k, l]) => el("option", { value: k }, l)));
        input.value = data[key] || "";
        input.addEventListener("change", () => { data[key] = input.value; save(); });
      } else {
        input = el("textarea", { id, rows: "2", placeholder: hint });
        input.value = data[key] || "";
        input.addEventListener("input", () => { data[key] = input.value; save(); });
      }
      fs.append(el("label", { class: "f", for: id }, label), input);
    }
    p.append(fs, el("div", { class: "btns" },
      el("button", { class: "b", disabled: WR.step === 0, onclick: () => { WR.step--; renderWrPanel(); } }, "上一步"),
      el("button", { class: "b primary", onclick: () => { WR.step++; renderWrPanel(); } }, WR.step === FIELDS.length - 1 ? "整理檢查 →" : "下一步")));
    if (WR.step === 0 && WR.sel !== -1) p.append(el("p", { class: "note" }, "提示：這題是「" + TYPES[W2[WR.sel][0]] + "」。先判斷題型再決定立場，雙問句兩個問題都要回答。"));
    return;
  }

  // 整理檢查
  const para = (h, keys) => el("div", {}, el("h4", {}, h), el("p", {}, keys.map(k => data[k] || "").filter(Boolean).join(" ") || "（還沒寫）"));
  const outline = el("div", { class: "outline" },
    el("div", {}, el("h4", {}, "立場"), el("p", {}, (data.kind ? `[${TYPES[data.kind]}] ` : "") + (data.stance || "（還沒寫）"))),
    para("Introduction", ["intro1", "intro2"]), para("Body 1", ["b1t", "b1e", "b1x", "b1l"]),
    para("Body 2", ["b2t", "b2e", "b2x", "b2l"]), para("Conclusion", ["c1", "c2"]));
  const checks = [
    "立場在引言和結論都看得到，而且一致",
    "每個主體段只有一個論點",
    "例子是具體的情境，不是「研究顯示」",
    "連接詞沒有每句開頭都用",
    "結論沒有加入新觀點",
  ];
  const fb = el("div", { class: "feedback", hidden: true });
  const status = el("span", { class: "status" });
  const askBtn = el("button", { class: "b", onclick: async () => {
    askBtn.disabled = true; fb.hidden = false; fb.textContent = "AI 批改中，大約 10–20 秒…";
    const text = `題型判斷：${TYPES[data.kind] || "未選"}
立場：${data.stance || ""}
引言：${data.intro1 || ""} ${data.intro2 || ""}
主體1：${["b1t","b1e","b1x","b1l"].map(k => data[k] || "").join(" ")}
主體2：${["b2t","b2e","b2x","b2l"].map(k => data[k] || "").join(" ")}
結論：${data.c1 || ""} ${data.c2 || ""}`;
    fb.textContent = await aiReview({ kind: "writing", question: wrPrompt(), answer: text });
    askBtn.disabled = false;
  } }, "AI 看大綱");
  const saveBtn = el("button", { class: "b primary", onclick: async () => {
    data.done = true; save();
    const rec = { prompt: wrPrompt(), ...data, ts: Date.now() };
    const logs = store.get("wrLog", []); logs.unshift(rec); store.set("wrLog", logs.slice(0, 100));
    if (db) { try { await db.collection("essays").add(rec); status.textContent = "已存到紀錄。"; } catch { status.textContent = "只存在這台裝置。"; } }
    else status.textContent = "已存在這台裝置。";
    renderWrList();
  } }, "存到紀錄");
  p.append(el("fieldset", {}, el("legend", {}, "我的大綱"), outline),
    el("fieldset", {}, el("legend", {}, "自我檢查"), ...checks.map((c, i) => {
      const id = "chk-" + i;
      const cb = el("input", { type: "checkbox", id }); cb.checked = !!(data.checks || {})[i];
      cb.addEventListener("change", () => { data.checks = { ...(data.checks || {}), [i]: cb.checked }; save(); });
      return el("label", { for: id, style: "display:flex;gap:8px;align-items:flex-start;font-size:14px" }, cb, c);
    })),
    el("div", { class: "btns" }, saveBtn, askBtn,
      el("button", { class: "b", onclick: () => { for (const k of Object.keys(data)) delete data[k]; save(); WR.step = 0; renderWrite(); } }, "清空重寫"), status),
    fb);
}
function renderWrite() { renderWrFilters(); renderWrList(); renderWrPanel(); }

/* ---------- 紀錄 ---------- */
let remoteEssays = null, remoteSpeak = null;
function renderLog() {
  const p = $("#log-panel"); p.replaceChildren();
  const essays = remoteEssays || store.get("wrLog", []);
  const speaks = remoteSpeak || store.get("spLog", []);
  const hard = Object.entries(marks).filter(([, v]) => v === "hard").length;
  const done = Object.entries(marks).filter(([, v]) => v === "done").length;
  p.append(el("h2", { class: "q", style: "font-size:22px" }, "練習紀錄"),
    el("p", { class: "note" }, `口說：練好 ${done} 題、不熟 ${hard} 題 · 寫作大綱 ${essays.length} 篇 · ${db ? "存在雲端，Claude 在對話裡讀得到" : "只存在這台裝置的瀏覽器"}`));
  const sec = (title, rows, fmt) => {
    const box = el("div", {}, el("h3", { style: "font-size:15px;margin:12px 0 0" }, title));
    if (!rows.length) box.append(el("p", { class: "note", style: "padding-top:8px" }, "還沒有紀錄。練完按「存到紀錄」就會出現在這裡。"));
    rows.slice(0, 60).forEach(r => box.append(fmt(r)));
    return box;
  };
  const when = ts => new Date(ts).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  p.append(sec("寫作大綱", essays, r => el("div", { class: "rec" },
    el("span", { class: "meta" }, when(r.ts)),
    el("details", {}, el("summary", {}, r.stance || r.prompt.slice(0, 80)),
      el("div", { class: "outline", style: "padding-top:8px" },
        el("p", { class: "note" }, r.prompt),
        ...[["Intro", ["intro1", "intro2"]], ["Body 1", ["b1t", "b1e", "b1x", "b1l"]], ["Body 2", ["b2t", "b2e", "b2x", "b2l"]], ["Conclusion", ["c1", "c2"]]]
          .map(([h, ks]) => el("div", {}, el("h4", {}, h), el("p", {}, ks.map(k => r[k] || "").join(" ")))))))));
  p.append(sec("口說回答", speaks, r => el("div", { class: "rec" },
    el("span", { class: "meta" }, `${when(r.ts)} · Part ${r.part}${r.mark === "hard" ? " · 不熟" : ""}`),
    el("details", {}, el("summary", {}, r.question), el("p", { style: "white-space:pre-wrap;margin:6px 0 0" }, r.answer || "（沒有逐字稿）")))));
}

/* ---------- 分頁、倒數 ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  stopTimer();
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", String(x === b)));
  for (const t of ["speak", "write", "log"]) $("#view-" + t).hidden = t !== b.dataset.tab;
  if (b.dataset.tab === "speak") renderSpPanel();
  if (b.dataset.tab === "write") renderWrite();
  if (b.dataset.tab === "log") renderLog();
}));
function renderCountdown() {
  const d = Math.ceil((EXAM - new Date()) / 86400000);
  $("#countdown").replaceChildren(d > 0 ? el("span", {}, "距離 11/25 考試 ", el("b", {}, String(d)), " 天") : el("span", {}, "考試日已過"));
}
renderSpeak();

</script>
