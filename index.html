<body>
<style>
/* Layout: 頂部分頁；左欄題目清單、右欄一次只練一題（手機時上下堆疊） */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --fg:#26292b; --muted:#6c7172; --line:#dfe1dd;
  --accent:#5f7a72; --accent-soft:#e3ebe7; --hard:#b0756b; --hard-soft:#f3e4e0; --done:#6f8f6a;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1d1e; --surface:#232627; --fg:#e7e8e5; --muted:#9ba09e; --line:#363a3a;
  --accent:#8fb0a6; --accent-soft:#2c3936; --hard:#d39a8f; --hard-soft:#3d2c29; --done:#9bbd94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1d1e; --surface:#232627; --fg:#e7e8e5; --muted:#9ba09e; --line:#363a3a;
  --accent:#8fb0a6; --accent-soft:#2c3936; --hard:#d39a8f; --hard-soft:#3d2c29; --done:#9bbd94; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.countdown{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}
.countdown b{color:var(--accent);font-size:20px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:78vh;min-width:0}
@media (max-width:820px){aside{max-height:300px}}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.list{overflow-y:auto;padding:6px}
.group-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current="true"]{background:var(--accent-soft);font-weight:500}
.item .t{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--line)}
.dot.done{background:var(--done);border-color:var(--done)} .dot.hard{background:var(--hard);border-color:var(--hard)}
.tag{font-size:11px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;flex:none}
main.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.crumb{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
.cue{border-left:3px solid var(--accent);padding:4px 0 4px 16px}
.cue p{margin:0 0 4px;color:var(--muted)} .cue ul{margin:0;padding-left:20px}
.timer-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.clock{font-family:var(--f-mono);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:var(--hard)}
.phase{font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{font:inherit;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
button.b.hardbtn[aria-pressed="true"]{background:var(--hard-soft);border-color:var(--hard);color:var(--hard)}
button.b.donebtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--done);color:var(--done)}
button.b:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f span.hint{font-size:12px;opacity:.85}
textarea,input[type=text],select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.55}
.feedback{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;white-space:pre-wrap;font-size:14px;line-height:1.7}
.note{font-size:12.5px;color:var(--muted);margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:none;font-family:inherit;cursor:pointer}
.step[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:500}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:700;font-size:14px;padding:0 6px}
.prompt-box.exam{display:flex;flex-direction:column;gap:10px;font-family:Georgia,"Times New Roman",serif}
.prompt-box.exam p{margin:0}
.exam-h{font-family:var(--f-body);font-weight:700;letter-spacing:.06em}
.exam-q{font-weight:700;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:4px}
.frames{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.frames-h{font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.frame{display:flex;flex-direction:column;gap:3px;min-width:0}
.frame + .frame{border-top:1px solid var(--line);padding-top:10px}
.frame-f{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;overflow-wrap:anywhere}
.frame-x{font-size:13.5px;color:var(--fg)}
.frame-n{font-size:12.5px;color:var(--muted)}
button.b.frame-use{align-self:flex-start;font-size:12.5px;padding:3px 10px;margin-top:2px}
.c-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.collo{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
table.collo th{text-align:left;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0}
table.collo td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.collo tr:last-child td{border-bottom:0}
.c-wrong{color:var(--hard);text-decoration:line-through;text-decoration-thickness:1px}
.c-right{font-weight:700;color:var(--accent)}
.c-ex{color:var(--muted);font-size:13px}
.c-why{font-size:14px;line-height:1.6;min-width:220px}
.frame .c-why{min-width:0;margin-top:4px;color:var(--fg)}
.c-example{color:var(--muted);font-size:13px;margin-top:2px}
.c-cat{font-size:12px;color:var(--muted);white-space:nowrap}
.c-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.c-form{grid-template-columns:minmax(0,1fr)}}
.warn-text{color:var(--hard)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cmp-h{font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--muted);padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.cmp-c{padding:12px 14px;font-size:14.5px;line-height:1.7;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.cmp-r{border-left:1px solid var(--line)}
.cmp-h.cmp-r{color:var(--accent)}
.cmp > :nth-last-child(-n+2){border-bottom:0}
@media (max-width:640px){
  .cmp{grid-template-columns:minmax(0,1fr)}
  .cmp-h{display:none}
  .cmp-r{border-left:0}
  .cmp-c::before{content:attr(data-label);display:block;font-size:11px;letter-spacing:.06em;font-weight:700;color:var(--muted);margin-bottom:4px}
  .cmp-c.cmp-r::before{color:var(--accent)}
  .cmp > :nth-last-child(-n+2){border-bottom:1px solid var(--line)}
  .cmp > :last-child{border-bottom:0}
}
.sents{display:flex;flex-direction:column;gap:10px}
.sent{display:flex;flex-direction:column;gap:3px}
.sent-tag{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.sent-role{font-size:11px;font-weight:700;color:var(--surface);background:var(--accent);border-radius:4px;padding:0 6px;line-height:1.7;white-space:nowrap}
.sent-pat{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
mark.typo{background:none;color:var(--hard);font-weight:700;text-decoration:underline wavy var(--hard);text-underline-offset:3px;cursor:help}
.typo-alt{color:var(--hard);font-size:.92em}
.typo-fix{color:var(--hard);font-family:var(--f-mono);font-size:12.5px}
.g-ins{color:#b8860b;font-weight:700}
.g-del{color:var(--muted);text-decoration:line-through;text-decoration-color:#b8860b;text-decoration-thickness:2px}
.gfix-list{font-size:14px;line-height:1.6;padding-left:20px;margin:10px 0 0}
.gfix-list li{margin-bottom:6px}
.gfix-o{color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g-ins{color:#e8c25a}}
mark.upg{background:none;color:#2f6db5;font-weight:700;text-decoration:underline #2f6db5;text-underline-offset:3px}
.upg-alt{color:#2f6db5;font-size:.92em}
.u-zh{font-weight:700;white-space:nowrap}
.u-orig{color:var(--muted)}
.u-better{font-weight:700;color:#2f6db5}
.prompt-box{font-size:16.5px;line-height:1.65;background:var(--bg);border-radius:8px;padding:14px 16px;border:1px solid var(--line)}
.outline{display:flex;flex-direction:column;gap:12px;font-size:15px}
.outline h4{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.outline p{margin:0}
.rec{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.rec .meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.rec details summary{cursor:pointer;font-weight:500}
.status{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>雅思練習室</h1>
      <p class="sub">口說一題一題練 · 寫作先寫立場和每段句子 · 題庫：2026 年 9–12 月</p>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-speak" aria-selected="true" data-tab="speak">口說</button>

    <button role="tab" id="tab-collo" aria-selected="false" data-tab="collo">搭配詞</button>

    <button role="tab" id="tab-log" aria-selected="false" data-tab="log">紀錄</button>

  <section id="view-speak" class="grid">
    <aside>

  <section id="view-collo" hidden>
    <main class="panel" id="collo-panel"></main>

</div>

<script>
/* ---------- 題庫資料 ---------- */
// 題目依第三方整理的 2026 年 9–12 月題庫主題重寫，實際考試措辭可能不同
const P1 = [
 ["Work or studies","must",["Do you work or are you a student?","Why did you choose your major?","What is the most interesting part of your studies?","What do you plan to do after you graduate?"]],
 ["Home / accommodation","must",["Do you live in a house or an apartment?","Which room do you like most in your home?","What would you like to change about your home?","Do you plan to live there for a long time?"]],
 ["Hometown","must",["Where is your hometown?","What is your hometown famous for?","Has your hometown changed much in recent years?","Would you like to live there in the future?"]],
 ["The area you live in","must",["Do you like the area you live in?","What facilities are there near your home?","Is it a quiet or a busy area?","How could your area be improved?"]],
 ["The city you live in","must",["Which city do you live in now?","What do you like most about this city?","Is public transport convenient there?","Would you recommend this city to visitors?"]],
 ["Travelling","new",["Do you like travelling?","Who do you usually travel with?","What kind of places do you like to visit?","Is there a place you would like to travel to in the future?"]],
 ["Rubbish and recycling","new",["Do you recycle at home?","Is it easy to recycle where you live?","Did you learn about recycling at school?","What could people do to produce less rubbish?"]],
 ["Tiredness","new",["When do you usually feel tired?","What do you do when you feel tired?","Do you feel more tired now than when you were younger?","Do you think students today are more tired than before?"]],
 ["Shoes","new",["Do you like buying shoes?","What kind of shoes do you usually wear?","Have you ever bought shoes online?","Do you prefer comfortable shoes or fashionable shoes?"]],
 ["Politeness","new",["Do you think you are a polite person?","How do people show politeness in your culture?","Who taught you to be polite?","Are people today less polite than in the past?"]],
 ["Fruit and vegetables","new",["Do you eat a lot of fruit and vegetables?","What is your favourite fruit?","Did you like vegetables when you were a child?","Is it expensive to buy fresh fruit where you live?"]],
 ["Advertisement","new",["Do you pay attention to advertisements?","Where do you usually see advertisements?","Have you ever bought something because of an advert?","Do you think there are too many adverts today?"]],
 ["Paper","new",["Do you use a lot of paper in daily life?","Do you prefer reading on paper or on a screen?","Is paper still important for students?","How can people use less paper?"]],
 ["Secondary school","new",["Where did you go to secondary school?","What was your favourite subject there?","Do you still keep in touch with your classmates?","What did you dislike about secondary school?"]],
 ["Name","new",["What is your full name?","Does your name have a special meaning?","Who gave you your name?","Would you like to change your name?"]],
 ["Opportunities","new",["What opportunities do you have in your studies or work now?","Have you ever missed a good opportunity?","Do young people today have more opportunities than before?","How do you usually prepare for a new opportunity?"]],
 ["Music","ret",["What kind of music do you like?","When do you usually listen to music?","Did you learn to play an instrument as a child?","Has your taste in music changed over time?"]],
 ["Teachers","ret",["Do you remember your first teacher?","What makes a good teacher?","Would you like to be a teacher?","Have you ever had a teacher who changed your life?"]],
 ["Social media","ret",["Which social media apps do you use?","How much time do you spend on social media each day?","What do you usually post?","Do you think social media is good for young people?"]],
 ["Tidiness","ret",["Are you a tidy person?","How often do you clean your room?","Do you think it is important to keep your desk tidy?","Were you tidy when you were a child?"]],
 ["Websites","ret",["What websites do you visit most often?","Have you ever made your own website?","What makes a website easy to use?","Do you prefer using apps or websites?"]],
 ["Watch","ret",["Do you wear a watch?","Have you ever received a watch as a gift?","Why do some people wear expensive watches?","Do you think watches will disappear in the future?"]],
 ["Shopping","ret",["Do you enjoy shopping?","Do you prefer shopping online or in stores?","What was the last thing you bought?","Do you usually shop alone or with others?"]],
 ["Cars","ret",["Do you have a car?","Do you like travelling by car?","Is driving common where you live?","Would you like to buy an electric car?"]],
 ["Public gardens and parks","ret",["Do you often go to parks?","What do people usually do in parks in your city?","Was there a park near your home when you were young?","How could parks in your city be improved?"]],
 ["Science","ret",["Did you like science at school?","Which science subject interests you most?","Do you watch science programmes?","How does science affect your daily life?"]],
 ["Mirrors","ret",["Do you often look in the mirror?","Do you have many mirrors at home?","Have you ever bought a mirror?","Why do some buildings use mirrors or reflective glass?"]],
 ["Outer space and stars","ret",["Do you like looking at the stars?","Is it easy to see stars where you live?","Would you like to travel into space?","Did you learn about space as a child?"]],
 ["Singing","ret",["Do you like singing?","Have you ever taken singing lessons?","Is karaoke popular in your country?","Do you think everyone can learn to sing well?"]],
 ["Clothing","ret",["What kind of clothes do you usually wear?","Do you wear different clothes at weekends?","Do you care about fashion?","Where do you usually buy clothes?"]],
 ["Jokes & comedies","ret",["Do you like watching comedies?","Are you good at telling jokes?","What makes you laugh?","Do people in your country share jokes online?"]],
 ["Headphones","ret",["Do you use headphones?","What do you use headphones for?","Do you prefer wireless or wired headphones?","Is it rude to wear headphones while talking to someone?"]],
 ["Morning time","ret",["Are you a morning person?","What do you usually do in the morning?","Do you eat breakfast every day?","Is your morning routine different at weekends?"]],
 ["Feeling bored","sup",["When do you usually feel bored?","What do you do when you feel bored?","Did you often feel bored as a child?","Do you think feeling bored can be useful?"]],
];

// [標題, 類別, 新/保留, 提示, Part 3 追問]
const PERSON = n => ["Who this person is","How you know this person",n,"And explain how you feel about this person"];
const EVENT = (a,b) => ["When and where it happened","Who you were with",a,b||"And explain how you felt about it"];
const PLACE = (a,b) => ["Where it is","When you went there",a,b||"And explain how you feel about this place"];
const THING = (a,b) => ["What it is","When and how you came across it",a,b||"And explain why you feel this way about it"];
const P2 = [
 ["Describe a person who did something difficult and succeeded","人物","new",PERSON("What difficult thing they did and how they succeeded"),["What qualities do people need to overcome difficulties?","Is success more about hard work or luck?","Should parents let children face difficulties on their own?"]],
 ["Describe a happy person you know","人物","new",PERSON("What this person usually does"),["What makes people happy in your country?","Are people today happier than in the past?","Can money buy happiness?"]],
 ["Describe a person who is well organized","人物","new",PERSON("How this person organizes things"),["Why are some people more organized than others?","Is being organized important at work?","Can technology help people become more organized?"]],
 ["Describe a person who likes taking photos","人物","new",PERSON("What kind of photos this person takes"),["Why do people take so many photos today?","Are professional photographers still needed?","Do photos help people remember the past?"]],
 ["Describe an older person you admire","人物","new",PERSON("What this person has done"),["What can young people learn from older people?","Do older people get enough respect today?","How has the role of grandparents changed?"]],
 ["Describe a person who is good at making things by hand","人物","new",PERSON("What this person makes"),["Are handmade things more valuable than machine-made ones?","Do children today learn practical skills?","Will handcrafts disappear in the future?"]],
 ["Describe a person who studies and loves history","人物","new",PERSON("What kind of history this person likes"),["Why is it important to learn history?","How can museums attract young people?","Should old buildings be preserved or replaced?"]],
 ["Describe a person who taught you a new skill","人物","new",PERSON("What skill they taught you and how"),["What is the best way to learn a new skill?","Is it better to learn from a teacher or from the internet?","Which skills will be important in the future?"]],
 ["Describe a popular person you know","人物","new",PERSON("Why this person is popular"),["What makes someone popular at school or work?","Is it important to be popular?","Why do some celebrities become popular very quickly?"]],

};

const ACCENTS = [["mix", "口音隨機輪換"], ["en-GB", "英國"], ["en-AU", "澳洲"], ["en-US", "美國"], ["en-CA", "加拿大"], ["en-IE", "愛爾蘭"], ["en-NZ", "紐西蘭"], ["en-IN", "印度"], ["en-ZA", "南非"], ["en-SG", "新加坡"]];
const accentName = lang => (ACCENTS.find(a => a[0].toLowerCase() === lang.replace("_", "-").toLowerCase()) || [0, lang])[1];
let voices = [], voiceByKey = {};
SP.accent = store.get("accent", "mix");
SP.rate = store.get("rate", 1);
// Mac、iPhone 內建一些唱歌、氣泡、機器人之類的特效聲音，抽到會像怪聲，全部排除
const ODD_VOICES = /\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Junior|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/i;
function loadVoices() { voices = canSpeak ? speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !ODD_VOICES.test(v.name)) : []; }
if (canSpeak) { loadVoices(); speechSynthesis.addEventListener("voiceschanged", () => { loadVoices(); if (SP.listen) renderSpFilters(); }); }
function voiceFor(key) {
  if (SP.accent !== "mix") {
    const pool = voices.filter(v => v.lang.replace("_", "-").toLowerCase() === SP.accent.toLowerCase());
    return pool.length ? pool[Math.floor(Math.random() * pool.length)] : voices.find(v => /en[-_]GB/i.test(v.lang)) || voices[0];
  }
  if (!voiceByKey[key] || !voices.includes(voiceByKey[key])) {
    // 先隨機選口音，再選該口音裡的一個聲音，避免美國聲音最多而一直抽到美國腔
    const langs = [...new Set(voices.map(v => v.lang.replace("_", "-").toLowerCase()))];
    const lang = langs[Math.floor(Math.random() * langs.length)];
    const pool = voices.filter(v => v.lang.replace("_", "-").toLowerCase() === lang);
    voiceByKey[key] = pool[Math.floor(Math.random() * pool.length)];
  }
  return voiceByKey[key];
}
for (const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, () => { userActed = true; }, { capture: true });
let sayTimer = 0;
function say(text, key, info) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  clearTimeout(sayTimer);
  if (!voices.length) loadVoices();
  const v = voiceFor(key);
  if (info) info.textContent = v ? `這題口音：${accentName(v.lang)}` : "";

  const parts = text.match(/[^.?!:\n]+[.?!:]?/g)?.map(x => x.trim()).filter(Boolean) || [text];
  sayTimer = setTimeout(() => {
    for (const part of parts) {
      const u = new SpeechSynthesisUtterance(part);
      if (v) u.voice = v;
      u.lang = v ? v.lang : "en-GB";
      u.rate = SP.rate;
      speechSynthesis.speak(u);

}

/* ---------- 共用：計時器 ---------- */
let tick = null;
function stopTimer() { clearInterval(tick); tick = null; }
function runTimer({ seconds, countUp = false, target = 0, onEnd, render }) {
  stopTimer();
  let t = 0;
  render(countUp ? 0 : seconds, 0);
  tick = setInterval(() => {
    t++;

/* ---------- 錄音轉文字（Whisper，在 Cloudflare 上跑） ---------- */
const TRANSCRIBE_URL = "https://ielts-review.cy9202.workers.dev/transcribe";
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let activeRec = null;   // 同一時間只錄一段

// 不管瀏覽器錄成 webm 還是 mp4，都先轉成 16kHz 單聲道 WAV 再送出
async function toWav16k(blob) {
  const raw = await blob.arrayBuffer();
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  const decoded = await ctx.decodeAudioData(raw);
  ctx.close();
  const rate = 16000, len = Math.ceil(decoded.duration * rate);
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = decoded; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: "audio/wav" });
}

// 錄音器沒有自己的按鈕，由「開始作答」一起控制：開始＝錄音＋計時，停止＝停錄並轉文字
function recorder(onText) {
  const status = el("span", { class: "status" });
  const player = el("audio", { controls: true, hidden: true, style: "width:100%;max-width:420px;height:36px" });
  const node = el("div", { style: "display:flex;flex-direction:column;gap:6px" }, status, player);
  if (!canRecord) status.textContent = "這個瀏覽器不能錄音，只會計時；請用 Chrome、Edge 或 Safari。";
  let rec = null, chunks = [], stream = null, cap = null;
  const stop = () => { clearTimeout(cap); if (rec && rec.state === "recording") rec.stop(); };
  const start = async () => {
    if (!canRecord) return false;
    if (activeRec && activeRec !== stop) activeRec();
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { status.textContent = "沒有拿到麥克風權限，這次只計時。請在網址列左邊的鎖頭圖示允許麥克風。"; return false; }
    chunks = []; rec = new MediaRecorder(stream);
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      if (activeRec === stop) activeRec = null;
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      player.src = URL.createObjectURL(blob); player.hidden = false;
      status.textContent = "轉文字中…";
      try {
        const wav = await toWav16k(blob);
        const r = await fetch(TRANSCRIBE_URL, { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) status.textContent = j.message || "轉文字失敗，請再錄一次。";
        else { onText(j.text); status.textContent = "已轉成文字，放進下面的回答欄；上面可以回聽錄音。"; }
      } catch { status.textContent = "轉文字失敗，請檢查網路後再錄一次。"; }
    };
    rec.start(); activeRec = stop;
    cap = setTimeout(stop, 300000);
    status.textContent = "● 錄音中";
    return true;
  };
  return { node, start, stop };
}

// 一顆按鈕同時開始錄音和計時；再按一次（或時間到）就一起停止
function goButton(ans, label, onStart) {
  const b = el("button", { class: "b primary" }, label);
  let on = false;
  const end = () => { if (!on) return; on = false; stopTimer(); ans.rec.stop(); b.textContent = label; };
  b.addEventListener("click", async () => {
    if (on) { end(); return; }
    on = true; b.textContent = "■ 停止作答"; b.disabled = true;
    await ans.rec.start();
    b.disabled = false;
    if (on) onStart(end);
  });
  return b;
}

  } }, "存到紀錄");
  p.append(el("fieldset", {}, el("legend", {}, "我的文章"), outline),

      const cb = el("input", { type: "checkbox", id }); cb.checked = !!(data.checks || {})[i];
      cb.addEventListener("change", () => { data.checks = { ...(data.checks || {}), [i]: cb.checked }; save(); });
      return el("label", { for: id, style: "display:flex;gap:8px;align-items:flex-start;font-size:14px" }, cb, c);
    })),

    fb, el("div", { class: "btns", style: "align-items:center" }, rwBtn, rwNote), rw);

/* ---------- 我的搭配詞（只放自己犯過的錯） ---------- */
const MY_COLLO_KEY = "myCollo";
// 公開網站給朋友用，不預先放我的錯誤
const COLLO_SEED = [];
const COLLO_STATE = { q: "" };
let colloImportMsg = "";
function openColloTab(msg) {
  colloImportMsg = msg;
  const b = document.querySelector('nav.tabs button[data-tab="collo"]');
  if (b) b.click();
}
function myCollo() {
  const mine = store.get(MY_COLLO_KEY, null);
  if (mine) return mine;
  store.set(MY_COLLO_KEY, COLLO_SEED);
  return COLLO_SEED.slice();
}
function addCollo(items) {
  const m = myCollo();
  let added = 0;
  for (const it of items) {
    const w = it.wrong.trim(), r = it.right.trim();
    if (!w || !r || m.some(x => x.wrong.toLowerCase() === w.toLowerCase())) continue;
    if (it.from !== "自己加的" && isGrammarOnly(w, r)) continue;
    m.unshift({ wrong: w, right: r, note: (it.note || "").trim(), from: it.from || "", ts: Date.now() });
    added++;
  }
  store.set(MY_COLLO_KEY, m);
  return added;
}

// AI 批改最後一行「FIXES: 錯 => 對 | 錯 => 對」：拿出來變成可加入表格的按鈕
// 只差在字尾（-s、-ed、-ing）、be/have/do 的變化、或冠詞的修正，算文法錯誤，不放進搭配詞
const GRAMMAR_WORDS = new Set(["a", "an", "the", "is", "are", "was", "were", "be", "been", "being", "am", "have", "has", "had", "do", "does", "did"]);
function isGrammarOnly(wrong, right) {
  const tok = t => t.toLowerCase().replace(/[^a-z' ]/g, " ").split(/\s+/).filter(Boolean);
  const a = tok(wrong).filter(w => !GRAMMAR_WORDS.has(w)), b = tok(right).filter(w => !GRAMMAR_WORDS.has(w));
  if (a.length !== b.length) return false;
  const stem = w => w.replace(/ies$/, "y").replace(/(es|s|ed|d|ing)$/, "");
  return a.every((w, i) => w === b[i] || stem(w) === stem(b[i]) || b[i].startsWith(w) && b[i].length - w.length <= 3 || w.startsWith(b[i]) && w.length - b[i].length <= 3);
}
function parseFixes(text) {
  const fixes = [];
  const clean = text.replace(/^.*FIXES:(.*)$/m, (line, list) => {
    for (const part of list.split("|")) {
      const [w, r] = part.split("=>").map(x => (x || "").trim().replace(/^["“”']|["“”']$/g, ""));
      if (w && r && w !== "無" && !isGrammarOnly(w, r)) fixes.push({ wrong: w, right: r });
    }
    return "";
  }).trim();
  return { text: clean, fixes };
}
function showReview(fb, raw, from) {
  const { text, fixes } = parseFixes(raw);
  fb.textContent = text;
  if (!fixes.length) return;
  // 自動存進這台電腦的「我的搭配詞」（每個人各自的瀏覽器，不會跑到別人那裡）
  const fresh = fixes.filter(fx => !myCollo().some(x => x.wrong.toLowerCase() === fx.wrong.toLowerCase()));
  addCollo(fresh.map(fx => ({ ...fx, from })));
  const box = el("div", { class: "frames", style: "margin-top:12px;white-space:normal" },
    el("span", { class: "frames-h" }, "這次用錯的說法 · 已自動存進我的搭配詞"),
    el("span", { class: "frame-n" }, "AI 偶爾會把原本正確的句子也列進來；不是你的錯就按「不是錯，移除」。"));
  const notes = [];
  for (const fx of fixes) {
    const isNew = fresh.includes(fx);
    const btn = el("button", { class: "b frame-use" }, isNew ? "不是錯，移除" : "表格裡本來就有");
    if (!isNew) btn.disabled = true;
    btn.addEventListener("click", () => {
      const m = myCollo().filter(x => x.wrong.toLowerCase() !== fx.wrong.toLowerCase());
      store.set(MY_COLLO_KEY, m);
      btn.textContent = "已移除"; btn.disabled = true;
    });
    const why = el("div", { class: "c-why" });
    notes.push([fx, why]);
    box.append(el("div", { class: "frame" },
      el("div", {}, el("div", {}, el("span", { class: "c-wrong" }, fx.wrong), " → ", el("span", { class: "c-right" }, fx.right)), why), btn));
  }
  fb.append(box);
  const drawWhy = () => notes.forEach(([fx, why]) => {
    const row = myCollo().find(x => x.wrong.toLowerCase() === fx.wrong.toLowerCase());
    why.replaceChildren(...(row ? colloWhy(row) : []));
  });
  const pend = fillColloNotes();
  drawWhy();
  pend.then(drawWhy);
}

async function requestExplain(items) {
  try {
    const r = await fetch(REVIEW_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kind: "explain", items }) });
    const j = await r.json().catch(() => ({}));
    return r.ok ? j : { message: j.message || "這次沒有寫出說明。" };
  } catch { return { message: "連不上伺服器，沒有寫出說明。" }; }
}
// 還沒有說明的搭配詞請 AI 補上；每筆這次開網頁只試一次，失敗不會一直重試
const colloTried = new Set();
let colloExplaining = null;
function fillColloNotes() {
  if (colloExplaining) return colloExplaining;
  const need = myCollo().filter(x => !x.note && !colloTried.has(x.wrong.toLowerCase())).slice(0, 15);
  if (!need.length) return Promise.resolve();
  need.forEach(x => colloTried.add(x.wrong.toLowerCase()));
  colloExplaining = requestExplain(need.map(x => ({ wrong: x.wrong, right: x.right }))).then(r => {
    colloExplaining = null;
    if (!r.notes) return;
    const m = myCollo();
    for (const n of r.notes) {
      const row = m.find(x => x.wrong.toLowerCase() === String(n.wrong).trim().toLowerCase());
      if (row && !row.note) { row.note = [n.why, n.how].filter(Boolean).join(" "); row.ex = n.example || ""; }
    }
    store.set(MY_COLLO_KEY, m);
    if (!$("#view-collo").hidden) renderCollo();
  });
  return colloExplaining;
}
function colloWhy(r) {
  const pending = !r.note && colloTried.has(r.wrong.toLowerCase()) && colloExplaining;
  return [r.note || (pending ? "正在寫說明…" : ""), r.ex ? el("div", { class: "c-example" }, "例：" + r.ex) : null];
}
function renderCollo() {
  // 只差單複數、字尾變化或冠詞的是文法錯誤，不留在搭配詞（自己手動加的不動）
  const kept = myCollo().filter(x => x.from === "自己加的" || !isGrammarOnly(x.wrong, x.right));
  if (kept.length !== myCollo().length) store.set(MY_COLLO_KEY, kept);
  fillColloNotes();
  const p = $("#collo-panel"); p.replaceChildren();
  const rows = myCollo();
  const search = el("input", { type: "text", id: "collo-q", placeholder: "搜尋", value: COLLO_STATE.q });
  const tbody = el("tbody");
  const when = ts => ts ? new Date(ts).toLocaleDateString("zh-TW", { month: "numeric", day: "numeric" }) : "";
  const fill = () => {
    const q = COLLO_STATE.q.trim().toLowerCase();
    const shown = rows.map((r, i) => [r, i]).filter(([r]) => !q || [r.wrong, r.right, r.note].join(" ").toLowerCase().includes(q));
    tbody.replaceChildren(...shown.map(([r, i]) => el("tr", {},
      el("td", { class: "c-wrong" }, r.wrong),
      el("td", { class: "c-right" }, r.right),
      el("td", { class: "c-why" }, ...colloWhy(r)),
      el("td", { class: "c-cat" }, [r.from, when(r.ts)].filter(Boolean).join(" · ")),
      el("td", {}, el("button", { class: "b", style: "font-size:12px;padding:2px 8px", onclick: () => { const m = myCollo(); m.splice(i, 1); store.set(MY_COLLO_KEY, m); renderCollo(); } }, "刪除")))));
    if (!shown.length) tbody.append(el("tr", {}, el("td", { colspan: "5", class: "c-ex" }, q ? "沒有符合的說法。" : "還沒有紀錄。AI 批改時用錯的說法會自動出現在這裡。")));
  };
  search.addEventListener("input", () => { COLLO_STATE.q = search.value; fill(); });
  fill();
  const fw = el("input", { type: "text", id: "my-wrong", placeholder: "錯誤說法，例如 it have" });
  const fr = el("input", { type: "text", id: "my-right", placeholder: "正確說法，例如 it has" });
  const fn = el("input", { type: "text", id: "my-note", placeholder: "為什麼錯（可不填，AI 會補）" });
  const msg = el("span", { class: "status" });
  const add = el("button", { class: "b primary", onclick: () => {
    if (!fw.value.trim() || !fr.value.trim()) { msg.textContent = "錯誤和正確說法都要填。"; return; }
    if (!addCollo([{ wrong: fw.value, right: fr.value, note: fn.value, from: "自己加的" }])) { msg.textContent = "表格裡已經有這個說法了。"; return; }
    renderCollo();
  } }, "加入表格");
  p.append(
    el("h2", { class: "q", style: "font-size:22px" }, "我的搭配詞"),
    colloImportMsg ? el("p", { class: "status", style: "color:var(--accent)" }, colloImportMsg) : null,
    el("p", { class: "note" }, `只放自己犯過的錯，共 ${rows.length} 筆。AI 批改時用錯的說法會自動存進來，也可以在下面自己加。`),
    search,
    el("div", { class: "c-wrap" }, el("table", { class: "collo" },
      el("thead", {}, el("tr", {}, ["我用錯的", "更好的說法", "為什麼不能用、怎麼用", "來源", ""].map(h => el("th", {}, h)))), tbody)),
    el("fieldset", {}, el("legend", {}, "自己加一筆"),
      el("div", { class: "c-form" }, fw, fr, fn), el("div", { class: "btns", style: "align-items:center" }, add, msg)));
}

/* ---------- 更好的說法（自己寫過、可以寫更好的片語） ---------- */
const MY_UPG_KEY = "myUpgrades";
const UPG_STATE = { q: "" };
let upgImportMsg = "";

    if (!shown.length) tbody.append(el("tr", {}, el("td", { colspan: "5", class: "c-ex" }, q ? "沒有符合的說法。" : "還沒有紀錄。寫作按「批改」後，藍色標出的片語會自動存進來。")));
  };

    if (!addUpgrades([{ zh: fz.value, original: fo.value, better: fb2.value, from: "自己加的" }])) { msg.textContent = "表格裡已經有這個說法了。"; return; }
    renderUpg();

  p.append(
    el("h2", { class: "q", style: "font-size:22px" }, "更好的說法"),

    el("p", { class: "note" }, `不算錯、但可以寫得更自然精準的片語，共 ${rows.length} 筆。寫作按「批改」後藍色標出的會自動存進來。`),
    search,
    el("div", { class: "c-wrap" }, el("table", { class: "collo" },
      el("thead", {}, el("tr", {}, ["中文", "我原本寫", "更好的寫法", "來源", ""].map(h => el("th", {}, h)))), tbody)),
    el("fieldset", {}, el("legend", {}, "自己加一筆"),
